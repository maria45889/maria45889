<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    @keyframes tailWag {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
    }
    @keyframes typing {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 5px #FF6B9D); }
      50% { filter: drop-shadow(0 0 15px #C77DFF); }
    }
    @keyframes screenGlow {
      0%, 100% { fill: #0D1117; }
      50% { fill: #1a1a2e; }
    }
    @keyframes codeLine {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .eye { transform-origin: center; animation: blink 4s infinite; }
    .tail { transform-origin: 160px 140px; animation: tailWag 2s ease-in-out infinite; }
    .paws { animation: typing 0.5s ease-in-out infinite; }
    .cat-glow { animation: glow 3s ease-in-out infinite; }
    .screen { animation: screenGlow 4s ease-in-out infinite; }
    .code-line { animation: codeLine 1.5s ease-in-out infinite; }
    .code-line:nth-child(2) { animation-delay: 0.3s; }
    .code-line:nth-child(3) { animation-delay: 0.6s; }
  </style>
  
  <!-- Background glow -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF6B9D;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#C77DFF;stop-opacity:0" />
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="90" fill="url(#bgGlow)" />
  
  <!-- Computer monitor -->
  <rect x="30" y="60" width="140" height="90" rx="5" fill="#1a1a2e" stroke="#FF6B9D" stroke-width="2"/>
  <rect x="35" y="65" width="130" height="80" rx="3" class="screen"/>
  
  <!-- Code lines on screen -->
  <g class="code-lines">
    <rect x="40" y="75" width="60" height="4" rx="2" fill="#FF6B9D" class="code-line"/>
    <rect x="40" y="85" width="80" height="4" rx="2" fill="#C77DFF" class="code-line"/>
    <rect x="40" y="95" width="50" height="4" rx="2" fill="#E0AAFF" class="code-line"/>
    <rect x="40" y="105" width="70" height="4" rx="2" fill="#FF6B9D" class="code-line"/>
    <rect x="40" y="115" width="40" height="4" rx="2" fill="#C77DFF" class="code-line"/>
    <rect x="40" y="125" width="55" height="4" rx="2" fill="#E0AAFF" class="code-line"/>
  </g>
  
  <!-- Monitor stand -->
  <rect x="90" y="150" width="20" height="20" fill="#1a1a2e"/>
  <rect x="70" y="170" width="60" height="5" rx="2" fill="#1a1a2e"/>
  
  <!-- Cat body -->
  <g class="cat-glow">
    <!-- Body -->
    <ellipse cx="100" cy="160" rx="35" ry="25" fill="#2a2a3e"/>
    
    <!-- Head -->
    <circle cx="100" cy="130" r="30" fill="#2a2a3e"/>
    
    <!-- Ears -->
    <polygon points="75,105 85,130 65,130" fill="#2a2a3e"/>
    <polygon points="125,105 115,130 135,130" fill="#2a2a3e"/>
    <polygon points="78,110 85,125 70,125" fill="#FF6B9D"/>
    <polygon points="122,110 115,125 130,125" fill="#FF6B9D"/>
    
    <!-- Eyes -->
    <g class="eye">
      <ellipse cx="88" cy="128" rx="8" ry="10" fill="#0D1117"/>
      <circle cx="88" cy="126" r="4" fill="#C77DFF"/>
      <circle cx="86" cy="124" r="1.5" fill="white"/>
    </g>
    <g class="eye">
      <ellipse cx="112" cy="128" rx="8" ry="10" fill="#0D1117"/>
      <circle cx="112" cy="126" r="4" fill="#C77DFF"/>
      <circle cx="110" cy="124" r="1.5" fill="white"/>
    </g>
    
    <!-- Nose -->
    <polygon points="100,135 96,140 104,140" fill="#FF6B9D"/>
    
    <!-- Mouth -->
    <path d="M 95 143 Q 100 148 105 143" stroke="#C77DFF" stroke-width="2" fill="none"/>
    
    <!-- Whiskers -->
    <line x1="70" y1="135" x2="85" y2="138" stroke="#E0AAFF" stroke-width="1.5"/>
    <line x1="70" y1="140" x2="85" y2="140" stroke="#E0AAFF" stroke-width="1.5"/>
    <line x1="130" y1="135" x2="115" y2="138" stroke="#E0AAFF" stroke-width="1.5"/>
    <line x1="130" y1="140" x2="115" y2="140" stroke="#E0AAFF" stroke-width="1.5"/>
    
    <!-- Paws on keyboard -->
    <g class="paws">
      <ellipse cx="80" cy="165" rx="12" ry="8" fill="#2a2a3e"/>
      <ellipse cx="120" cy="165" rx="12" ry="8" fill="#2a2a3e"/>
    </g>
    
    <!-- Tail -->
    <path d="M 135 160 Q 160 150 165 130 Q 170 110 160 100" stroke="#2a2a3e" stroke-width="12" fill="none" stroke-linecap="round" class="tail"/>
  </g>
  
  <!-- Keyboard -->
  <rect x="50" y="175" width="100" height="15" rx="3" fill="#1a1a2e" stroke="#FF6B9D" stroke-width="1"/>
  <g fill="#C77DFF">
    <rect x="55" y="178" width="8" height="4" rx="1"/>
    <rect x="66" y="178" width="8" height="4" rx="1"/>
    <rect x="77" y="178" width="8" height="4" rx="1"/>
    <rect x="88" y="178" width="8" height="4" rx="1"/>
    <rect x="99" y="178" width="8" height="4" rx="1"/>
    <rect x="110" y="178" width="8" height="4" rx="1"/>
    <rect x="121" y="178" width="8" height="4" rx="1"/>
    <rect x="132" y="178" width="8" height="4" rx="1"/>
  </g>
</svg>
