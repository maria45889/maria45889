<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a1a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a00e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e2de2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:0.3" />
    </linearGradient>
    
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:0" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="screenGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="300" fill="url(#bgGradient)" rx="20"/>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="30" fill="url(#glowGradient)" opacity="0.3"/>
  <circle cx="250" cy="250" r="40" fill="url(#glowGradient)" opacity="0.2"/>
  <circle cx="270" cy="80" r="20" fill="url(#glowGradient)" opacity="0.25"/>
  
  <!-- Code particles -->
  <g fill="#00d4ff" opacity="0.3">
    <text x="30" y="280" font-family="monospace" font-size="10">&lt;/&gt;</text>
    <text x="260" y="30" font-family="monospace" font-size="8">{ }</text>
    <text x="20" y="150" font-family="monospace" font-size="6">function</text>
    <text x="270" y="200" font-family="monospace" font-size="7">const</text>
  </g>
  
  <!-- Desk -->
  <rect x="50" y="220" width="200" height="10" rx="2" fill="#2a2a4a"/>
  <rect x="60" y="230" width="180" height="5" rx="1" fill="#1a1a3a"/>
  
  <!-- Computer monitor -->
  <g filter="url(#screenGlow)">
    <!-- Monitor frame -->
    <rect x="70" y="100" width="160" height="100" rx="5" fill="#1a1a3a" stroke="#00d4ff" stroke-width="2"/>
    
    <!-- Screen -->
    <rect x="75" y="105" width="150" height="90" rx="3" fill="url(#screenGradient)"/>
    
    <!-- Code on screen -->
    <g fill="#00d4ff" font-family="monospace" font-size="8">
      <text x="80" y="120">const dev = {</text>
      <text x="85" y="132">  name: "María",</text>
      <text x="85" y="144">  skills: ["Full Stack"],</text>
      <text x="85" y="156">  passion: "Code"</text>
      <text x="80" y="168">};</text>
    </g>
    
    <!-- Cursor blinking -->
    <rect x="145" y="160" width="8" height="12" fill="#7b2ff7">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Monitor stand -->
    <rect x="140" y="200" width="20" height="20" fill="#1a1a3a"/>
    <rect x="120" y="220" width="60" height="5" rx="2" fill="#1a1a3a"/>
  </g>
  
  <!-- Developer character -->
  <g>
    <!-- Hair -->
    <ellipse cx="150" cy="85" rx="45" ry="40" fill="url(#hairGradient)"/>
    <path d="M 105 85 Q 100 60 115 45 Q 150 30 185 45 Q 200 60 195 85" fill="url(#hairGradient)"/>
    
    <!-- Face -->
    <ellipse cx="150" cy="90" rx="35" ry="38" fill="#f5d0c5"/>
    
    <!-- Eyes -->
    <g>
      <ellipse cx="138" cy="88" rx="8" ry="10" fill="#1a1a3a"/>
      <circle cx="138" cy="86" r="4" fill="#00d4ff"/>
      <circle cx="136" cy="84" r="1.5" fill="white"/>
    </g>
    <g>
      <ellipse cx="162" cy="88" rx="8" ry="10" fill="#1a1a3a"/>
      <circle cx="162" cy="86" r="4" fill="#00d4ff"/>
      <circle cx="160" cy="84" r="1.5" fill="white"/>
    </g>
    
    <!-- Eyebrows -->
    <path d="M 128 78 Q 138 75 148 78" stroke="#4a00e0" stroke-width="2" fill="none"/>
    <path d="M 152 78 Q 162 75 172 78" stroke="#4a00e0" stroke-width="2" fill="none"/>
    
    <!-- Nose -->
    <path d="M 150 92 L 148 100 L 152 100" stroke="#e8b4a8" stroke-width="2" fill="none"/>
    
    <!-- Mouth -->
    <path d="M 142 108 Q 150 112 158 108" stroke="#e8a090" stroke-width="2" fill="none"/>
    
    <!-- Glasses -->
    <g stroke="#7b2ff7" stroke-width="2" fill="none">
      <rect x="125" y="82" width="26" height="18" rx="3"/>
      <rect x="149" y="82" width="26" height="18" rx="3"/>
      <line x1="151" y1="91" x2="149" y2="91"/>
    </g>
    
    <!-- Body/Shoulders -->
    <path d="M 110 125 Q 150 140 190 125 L 200 200 L 100 200 Z" fill="#2a2a4a"/>
    
    <!-- Hoodie details -->
    <path d="M 130 125 Q 150 135 170 125" stroke="#4a00e0" stroke-width="2" fill="none"/>
    
    <!-- Arms on keyboard -->
    <ellipse cx="120" cy="195" rx="15" ry="10" fill="#f5d0c5"/>
    <ellipse cx="180" cy="195" rx="15" ry="10" fill="#f5d0c5"/>
    
    <!-- Keyboard -->
    <rect x="90" y="215" width="120" height="12" rx="2" fill="#1a1a3a" stroke="#00d4ff" stroke-width="1"/>
    <g fill="#7b2ff7">
      <rect x="95" y="218" width="8" height="3" rx="1"/>
      <rect x="106" y="218" width="8" height="3" rx="1"/>
      <rect x="117" y="218" width="8" height="3" rx="1"/>
      <rect x="128" y="218" width="8" height="3" rx="1"/>
      <rect x="139" y="218" width="8" height="3" rx="1"/>
      <rect x="150" y="218" width="8" height="3" rx="1"/>
      <rect x="161" y="218" width="8" height="3" rx="1"/>
      <rect x="172" y="218" width="8" height="3" rx="1"/>
      <rect x="183" y="218" width="8" height="3" rx="1"/>
    </g>
  </g>
  
  <!-- Floating code elements -->
  <g fill="#00d4ff" opacity="0.4" font-family="monospace" font-size="10">
    <text x="40" y="60">
      <animate attributeName="y" values="60;50;60" dur="3s" repeatCount="indefinite"/>
      &lt;div&gt;
    </text>
    <text x="240" y="70">
      <animate attributeName="y" values="70;80;70" dur="4s" repeatCount="indefinite"/>
      {
    </text>
    <text x="35" y="180">
      <animate attributeName="y" values="180;170;180" dur="3.5s" repeatCount="indefinite"/>
      if
    </text>
    <text x="250" y="150">
      <animate attributeName="y" values="150;160;150" dur="2.5s" repeatCount="indefinite"/>
      }
    </text>
  </g>
  
  <!-- Glow effect around character -->
  <ellipse cx="150" cy="150" rx="100" ry="80" fill="url(#glowGradient)" opacity="0.15"/>
</svg>
