<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <style>
    @keyframes blink {
      0%, 85%, 100% { transform: scaleY(1); }
      90%, 95% { transform: scaleY(0.1); }
    }
    @keyframes tailWag {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg); }
    }
    @keyframes typing {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes screenGlow {
      0%, 100% { fill-opacity: 0.3; }
      50% { fill-opacity: 0.6; }
    }
    @keyframes particleFloat {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
      50% { transform: translateY(-10px) scale(1.2); opacity: 1; }
    }
    @keyframes cursorBlink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    @keyframes codePulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .eye { transform-origin: center; animation: blink 4s infinite; }
    .tail { transform-origin: 380px 320px; animation: tailWag 3s ease-in-out infinite; }
    .paw-left { animation: typing 0.6s ease-in-out infinite; }
    .paw-right { animation: typing 0.6s ease-in-out infinite 0.3s; }
    .screen-glow { animation: screenGlow 3s ease-in-out infinite; }
    .particle { animation: particleFloat 3s ease-in-out infinite; }
    .cursor { animation: cursorBlink 1s infinite; }
    .code-symbol { animation: codePulse 2s ease-in-out infinite; }
    .code-symbol:nth-child(2) { animation-delay: 0.4s; }
    .code-symbol:nth-child(3) { animation-delay: 0.8s; }
  </style>
  
  <!-- Background is transparent -->
  
  <!-- Floating particles -->
  <g class="particles">
    <circle cx="100" cy="100" r="3" fill="#00d4ff" class="particle" style="animation-delay: 0s;"/>
    <circle cx="400" cy="150" r="2" fill="#7b2ff7" class="particle" style="animation-delay: 1s;"/>
    <circle cx="80" cy="350" r="2.5" fill="#00d4ff" class="particle" style="animation-delay: 2s;"/>
    <circle cx="420" cy="380" r="3" fill="#7b2ff7" class="particle" style="animation-delay: 0.5s;"/>
    <circle cx="150" cy="80" r="2" fill="#00ffff" class="particle" style="animation-delay: 1.5s;"/>
    <circle cx="380" cy="100" r="2.5" fill="#00d4ff" class="particle" style="animation-delay: 2.5s;"/>
  </g>
  
  <!-- Desk surface -->
  <ellipse cx="250" cy="420" rx="200" ry="30" fill="#1a1a3a" opacity="0.5"/>
  
  <!-- Laptop -->
  <g transform="translate(100, 280)">
    <!-- Laptop base -->
    <rect x="0" y="80" width="300" height="15" rx="3" fill="#2a2a4a"/>
    <rect x="10" y="85" width="280" height="8" rx="2" fill="#1a1a3a"/>
    
    <!-- Laptop screen -->
    <rect x="20" y="0" width="260" height="85" rx="5" fill="#1a1a3a" stroke="#00d4ff" stroke-width="2"/>
    
    <!-- Screen content -->
    <rect x="25" y="5" width="250" height="75" rx="3" fill="#0a0a1a" class="screen-glow"/>
    
    <!-- Code symbols on screen -->
    <g fill="#00d4ff" font-family="monospace" font-size="14" font-weight="bold">
      <text x="35" y="25" class="code-symbol">&lt;/&gt;</text>
      <text x="80" y="45" class="code-symbol">{ }</text>
      <text x="130" y="25" class="code-symbol">if</text>
      <text x="170" y="45" class="code-symbol">const</text>
      <text x="220" y="30" class="code-symbol">&lt;div&gt;</text>
    </g>
    
    <!-- Cursor -->
    <rect x="200" y="55" width="10" height="15" fill="#7b2ff7" class="cursor"/>
    
    <!-- Keyboard glow -->
    <rect x="30" y="88" width="240" height="2" fill="#00d4ff" opacity="0.3" class="screen-glow"/>
  </g>
  
  <!-- Cat character -->
  <g transform="translate(250, 300)">
    <!-- Body (hoodie) -->
    <ellipse cx="0" cy="50" rx="60" ry="45" fill="#2a2a4a"/>
    
    <!-- Hoodie details -->
    <path d="M -40 30 Q 0 45 40 30" stroke="#3a3a5a" stroke-width="3" fill="none"/>
    <path d="M -30 50 Q 0 60 30 50" stroke="#3a3a5a" stroke-width="2" fill="none"/>
    
    <!-- Hoodie pocket -->
    <ellipse cx="0" cy="55" rx="25" ry="15" fill="#1a1a3a"/>
    
    <!-- Head -->
    <ellipse cx="0" cy="-20" rx="55" ry="50" fill="#f5f5f5"/>
    
    <!-- Gray details on face -->
    <ellipse cx="-25" cy="-35" rx="15" ry="12" fill="#e0e0e0"/>
    <ellipse cx="25" cy="-35" rx="15" ry="12" fill="#e0e0e0"/>
    
    <!-- Ears -->
    <g fill="#f5f5f5">
      <polygon points="-45,-55 -35,-25 -65,-25"/>
      <polygon points="45,-55 35,-25 65,-25"/>
    </g>
    
    <!-- Inner ears (pink) -->
    <g fill="#ffb6c1">
      <polygon points="-42,-50 -36,-28 -55,-28"/>
      <polygon points="42,-50 36,-28 55,-28"/>
    </g>
    
    <!-- Gray ear tips -->
    <g fill="#d0d0d0">
      <polygon points="-45,-55 -40,-35 -50,-35"/>
      <polygon points="45,-55 40,-35 50,-35"/>
    </g>
    
    <!-- Big black glasses -->
    <g>
      <!-- Left lens -->
      <ellipse cx="-22" cy="-18" rx="22" ry="18" fill="#1a1a3a" stroke="#0a0a1a" stroke-width="3"/>
      <!-- Right lens -->
      <ellipse cx="22" cy="-18" rx="22" ry="18" fill="#1a1a3a" stroke="#0a0a1a" stroke-width="3"/>
      <!-- Bridge -->
      <rect x="-5" y="-22" width="10" height="8" fill="#1a1a3a"/>
      <!-- Reflection on glasses -->
      <ellipse cx="-28" cy="-22" rx="8" ry="5" fill="#2a2a4a" opacity="0.5"/>
      <ellipse cx="16" cy="-22" rx="8" ry="5" fill="#2a2a4a" opacity="0.5"/>
    </g>
    
    <!-- Eyes behind glasses (visible through lenses) -->
    <g class="eye">
      <ellipse cx="-22" cy="-18" rx="12" ry="10" fill="#00d4ff"/>
      <circle cx="-22" cy="-20" r="5" fill="#1a1a3a"/>
      <circle cx="-24" cy="-22" r="2" fill="white"/>
    </g>
    <g class="eye">
      <ellipse cx="22" cy="-18" rx="12" ry="10" fill="#00d4ff"/>
      <circle cx="22" cy="-20" r="5" fill="#1a1a3a"/>
      <circle cx="20" cy="-22" r="2" fill="white"/>
    </g>
    
    <!-- Nose -->
    <ellipse cx="0" cy="5" rx="6" ry="4" fill="#ffb6c1"/>
    
    <!-- Mouth -->
    <path d="M -8 12 Q 0 18 8 12" stroke="#d0d0d0" stroke-width="2" fill="none"/>
    
    <!-- Whiskers -->
    <g stroke="#c0c0c0" stroke-width="1.5">
      <line x1="-40" y1="0" x2="-20" y2="5"/>
      <line x1="-42" y1="8" x2="-22" y2="8"/>
      <line x1="-40" y1="16" x2="-20" y2="11"/>
      <line x1="40" y1="0" x2="20" y2="5"/>
      <line x1="42" y1="8" x2="22" y2="8"/>
      <line x1="40" y1="16" x2="20" y2="11"/>
    </g>
    
    <!-- Paws on keyboard -->
    <g class="paw-left">
      <ellipse cx="-35" cy="75" rx="18" ry="12" fill="#f5f5f5"/>
      <ellipse cx="-35" cy="75" rx="10" ry="6" fill="#e0e0e0"/>
    </g>
    <g class="paw-right">
      <ellipse cx="35" cy="75" rx="18" ry="12" fill="#f5f5f5"/>
      <ellipse cx="35" cy="75" rx="10" ry="6" fill="#e0e0e0"/>
    </g>
    
    <!-- Tail -->
    <path d="M 55 40 Q 90 20 100 -10 Q 105 -30 90 -40" stroke="#f5f5f5" stroke-width="14" fill="none" stroke-linecap="round" class="tail"/>
    <path d="M 55 40 Q 90 20 100 -10 Q 105 -30 90 -40" stroke="#e0e0e0" stroke-width="8" fill="none" stroke-linecap="round" class="tail"/>
  </g>
  
  <!-- Code symbols floating around -->
  <g fill="#00d4ff" opacity="0.4" font-family="monospace" font-size="12">
    <text x="50" y="200">
      <animate attributeName="y" values="200;190;200" dur="4s" repeatCount="indefinite"/>
      &lt;div&gt;
    </text>
    <text x="420" y="220">
      <animate attributeName="y" values="220;230;220" dur="3s" repeatCount="indefinite"/>
      {
    </text>
    <text x="60" y="380">
      <animate attributeName="y" values="380;370;380" dur="3.5s" repeatCount="indefinite"/>
      if
    </text>
    <text x="430" y="350">
      <animate attributeName="y" values="350;360;350" dur="2.5s" repeatCount="indefinite"/>
      }
    </text>
  </g>
  
  <!-- Subtle glow around the cat -->
  <ellipse cx="250" cy="300" rx="120" ry="100" fill="url(#glowGradient)" opacity="0.1"/>
</svg>
