name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: Platane/snk@v3

        with:
          github_user_name: maria45889

          outputs: |
            dist/github-contribution-grid-snake.svg


      - uses: crazy-max/ghaction-github-pages@v4

        with:
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
